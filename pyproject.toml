[project]
name = "ai-trader"
version = "0.0.1"
description = "Multi-modal ML crypto trading bot"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "httpx>=0.27",
    "tqdm>=4.66",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
